[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Não expõe o código das funções como arquivo estático
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

# Artes de anúncio ficam só no repositório, não no site
[[redirects]]
  from = "/criativos/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
