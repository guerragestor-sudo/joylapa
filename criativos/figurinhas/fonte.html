<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Figurinhas Joy Lapa</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=block" rel="stylesheet">
<style>
  :root {
    --wine: #8e1b2e; --wine-700: #6f1323; --wine-50: #fbeef0; --red: #c8283a;
    --violet: #5a2386; --indigo: #3b2d93; --orange: #f08a24; --orange-300: #ffb45c; --orange-50: #fff2e4;
    --ink: #1f1633; --ink-2: #3f3753; --muted: #645d78; --green: #22c35e; --garden: #3d9a5b;
    --c-blue: #57b7e8; --c-green: #5cc48c; --c-yellow: #f0c23f; --c-coral: #f08a5f; --c-purple: #a76ad6;
    --joy: linear-gradient(100deg, #57b7e8 0%, #7dd6a4 22%, #f3d36b 45%, #f39a7a 68%, #b77cdd 100%);
    --deep: linear-gradient(150deg, #5a2386 0%, #3b2d93 55%, #273c9f 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1400px; height: 1400px; background: transparent; }
  body { display: grid; place-items: center; font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  svg { width: 1em; height: 1em; flex: none; }
  img { display: block; }

  /* Contorno branco de figurinha recortada + sombra */
  .cut { filter:
    drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff)
    drop-shadow(5px 5px 0 #fff) drop-shadow(-5px -5px 0 #fff) drop-shadow(5px -5px 0 #fff) drop-shadow(-5px 5px 0 #fff)
    drop-shadow(0 14px 16px rgba(31, 22, 51, .28)); }
  .shadow { filter: drop-shadow(0 14px 18px rgba(31, 22, 51, .3)); }

  /* ---------- Marca ---------- */
  .logo { display: inline-flex; align-items: center; gap: 22px; padding: 30px 46px 36px 34px; border-radius: 999px; background: #fff; position: relative; overflow: hidden; }
  .logo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--joy); }
  .logo svg { width: 92px; height: 92px; color: var(--wine); }
  .logo .t { display: grid; line-height: 1; }
  .logo b { font-size: 58px; font-weight: 800; letter-spacing: .08em; }
  .logo i { margin-top: 10px; font-style: normal; font-size: 28px; font-weight: 800; letter-spacing: .36em; color: var(--wine); }
  .logo.dark { background: var(--deep); color: #fff; }
  .logo.dark svg { color: #fff; --pin-c: #3b2d93; }
  .logo.dark i { color: var(--orange-300); }

  .bigpin { width: 420px; height: 420px; }

  .mcmv { display: grid; justify-items: center; gap: 10px; padding: 30px 40px 26px; border-radius: 40px; background: #fff; }
  .mcmv img { height: 130px; width: auto; }
  .mcmv span { font-size: 24px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--wine); }

  /* ---------- Oferta ---------- */
  .tag { position: relative; display: grid; align-content: center; width: 760px; height: 330px; padding: 0 60px 0 150px; background: var(--wine); color: #fff;
    clip-path: polygon(110px 0, 100% 0, 100% 100%, 110px 100%, 0 50%); border-radius: 0 40px 40px 0; transform: rotate(-6deg); }
  .tag::before { content: ""; position: absolute; left: 70px; top: 50%; width: 46px; height: 46px; margin-top: -23px; border-radius: 50%; background: #fff; box-shadow: inset 0 3px 6px rgba(0, 0, 0, .25); }
  .tag::after { content: ""; position: absolute; left: 110px; right: 0; bottom: 0; height: 14px; background: var(--joy); }
  .tag small { font-size: 34px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--orange-300); }
  .tag p { display: flex; align-items: baseline; gap: 10px; font-size: 168px; line-height: .9; font-weight: 800; letter-spacing: -.05em; }
  .tag p span { font-size: 60px; letter-spacing: 0; align-self: flex-start; margin-top: 18px; }
  .tag p em { font-style: normal; font-size: 70px; letter-spacing: -.02em; }

  .seal { position: relative; display: grid; place-items: center; width: 480px; height: 480px; transform: rotate(8deg); }
  .seal > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal div { position: relative; text-align: center; line-height: .95; }
  .seal small { display: block; font-size: 30px; font-weight: 800; letter-spacing: .22em; }
  .seal b { display: block; font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1.12; }
  .seal .spk { display: flex; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .seal .spk svg { width: 30px; height: 30px; color: var(--ink); }
  .bubble .spk-r { position: absolute; right: -26px; top: -30px; width: 76px; height: 76px; color: var(--wine); transform: rotate(12deg); }
  .bubble .spk-r svg { width: 100%; height: 100%; }
  .seal i { display: block; margin-top: 8px; font-style: normal; font-size: 26px; font-weight: 700; letter-spacing: .08em; }

  .pill { display: inline-flex; align-items: center; gap: 22px; padding: 22px 40px 22px 22px; border-radius: 999px; background: #fff; font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
  .pill .ic { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: var(--wine); color: #fff; font-size: 52px; }
  .pill.dark { background: var(--deep); color: #fff; }
  .pill.dark .ic { background: var(--orange); color: var(--ink); }
  .pill small { display: block; font-size: 26px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
  .pill.dark small { color: rgba(255, 255, 255, .75); }
  .pill .tx { line-height: 1.05; }

  .burst { position: relative; display: grid; place-items: center; width: 560px; height: 560px; }
  .burst > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .burst div { position: relative; text-align: center; line-height: .92; color: #fff; }
  .burst small { display: block; font-size: 36px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .burst b { display: block; margin-top: 6px; font-size: 108px; font-weight: 800; letter-spacing: -.05em; }
  .burst b span { font-size: 54px; letter-spacing: 0; }

  /* ---------- Lançamento ---------- */
  .cal { position: relative; width: 460px; border-radius: 40px; background: #fff; overflow: hidden; transform: rotate(-5deg); text-align: center; }
  .cal .top { padding: 46px 0 20px; background: var(--wine); color: #fff; font-size: 44px; font-weight: 800; letter-spacing: .2em; }
  .cal .rings { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 190px; }
  .cal .rings span { width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: inset 0 3px 5px rgba(0, 0, 0, .35); }
  .cal .day { font-size: 230px; line-height: 1; font-weight: 800; letter-spacing: -.06em; padding-top: 18px; }
  .cal .lbl { padding: 0 20px 36px; font-size: 34px; font-weight: 800; color: var(--wine); line-height: 1.1; }
  .cal .lbl small { display: block; font-size: 24px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }

  .ticket { position: relative; display: flex; width: 900px; height: 340px; transform: rotate(4deg);
    background:
      radial-gradient(circle at 0 50%, transparent 34px, var(--orange) 35px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 50%, transparent 34px, var(--orange) 35px) right / 51% 100% no-repeat;
    border-radius: 34px; }
  .ticket .stub { display: grid; place-items: center; width: 210px; border-right: 6px dashed rgba(31, 22, 51, .35); }
  .ticket .stub b { transform: rotate(-90deg); font-size: 74px; font-weight: 800; letter-spacing: .12em; }
  .ticket .main { flex: 1; display: grid; align-content: center; gap: 10px; padding: 0 60px 0 50px; }
  .ticket .main small { font-size: 28px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--wine-700); }
  .ticket .main b { font-size: 104px; line-height: .9; font-weight: 800; letter-spacing: -.04em; }
  .ticket .main span { font-size: 32px; font-weight: 700; }

  .tape { position: relative; padding: 34px 80px; transform: rotate(-4deg); background: var(--joy); opacity: .96;
    clip-path: polygon(0 6%, 3% 0, 6% 8%, 9% 0, 12% 6%, 88% 0, 91% 8%, 94% 0, 97% 7%, 100% 2%, 100% 94%, 97% 100%, 94% 92%, 91% 100%, 88% 94%, 12% 100%, 9% 92%, 6% 100%, 3% 93%, 0 100%); }
  .tape b { font-size: 60px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }

  .countdown { display: inline-flex; align-items: center; gap: 20px; padding: 26px 46px; border-radius: 30px; background: var(--deep); color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -.01em; }
  .countdown svg { width: 64px; height: 64px; color: var(--orange-300); }
  .countdown small { display: block; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange-300); }

  /* ---------- Plantas (losangos) ---------- */
  .badge { position: relative; isolation: isolate; display: grid; place-items: center; align-content: center; width: 520px; height: 520px; color: #fff; text-align: center; line-height: 1; }
  .badge::before { content: ""; position: absolute; inset: 76px; z-index: -1; transform: rotate(45deg); border-radius: 44px; background: var(--bb);
    box-shadow: inset 0 0 0 16px var(--bb), inset 0 0 0 21px rgba(255, 255, 255, .55); }
  .badge span { font-size: 34px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; opacity: .9; }
  .badge b { margin-top: 12px; font-size: 88px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
  .badge i { margin-top: 18px; padding: 10px 26px; font-style: normal; font-size: 44px; font-weight: 800; border-radius: 10px; background: var(--br); color: #fff; }
  .badge em { margin-top: 14px; font-style: normal; font-size: 24px; font-weight: 700; letter-spacing: .3em; opacity: .85; }
  .b-smart { --bb: #f2a774; --br: var(--red); color: var(--wine-700); }
  .b-select { --bb: var(--red); --br: var(--wine-700); }
  .b-prime { --bb: var(--wine); --br: #9b8169; }
  .b-garden { --bb: var(--garden); --br: #2b6e41; }

  /* ---------- Localização ---------- */
  .sign { width: 760px; border-radius: 34px; overflow: hidden; background: var(--ink); color: #fff; }
  .sign .bar { height: 26px; background: var(--joy); }
  .sign .in { display: flex; align-items: center; gap: 30px; padding: 34px 44px 40px; }
  .sign .in > svg { width: 120px; height: 120px; padding: 18px; border-radius: 26px; background: #fff; color: var(--ink); }
  .sign small { display: block; font-size: 30px; font-weight: 800; letter-spacing: .2em; color: var(--orange-300); }
  .sign b { display: block; margin-top: 8px; font-size: 96px; line-height: .95; font-weight: 800; letter-spacing: -.04em; }

  .loc { display: inline-flex; align-items: center; gap: 16px; padding: 22px 40px 22px 30px; border-radius: 22px; background: #fff; font-size: 50px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--wine); }
  .loc svg { width: 70px; height: 70px; }

  .line { position: relative; width: 1100px; height: 240px; }
  .line::before { content: ""; position: absolute; left: 40px; right: 110px; top: 150px; height: 40px; margin-top: -20px; border-radius: 20px; background: var(--joy); }
  .line span { position: absolute; top: 150px; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: #fff; border: 19px solid var(--ink); }
  .line svg { position: absolute; right: -10px; top: -40px; width: 230px; height: 230px; color: var(--wine); }

  /* ---------- Lazer (ícones) ---------- */
  .am { display: grid; justify-items: center; }
  .am .c { display: grid; place-items: center; width: 330px; height: 330px; border-radius: 50%; background: var(--bg); color: #fff; font-size: 170px; }
  .am b { margin-top: -38px; padding: 14px 34px; border-radius: 999px; background: #fff; font-size: 44px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); box-shadow: 0 8px 18px -10px rgba(31, 22, 51, .45); }

  /* ---------- Engajamento ---------- */
  .stamp { padding: 26px 46px; border: 14px solid var(--red); border-radius: 30px; color: var(--red); background: rgba(255, 255, 255, .92); transform: rotate(-8deg); text-align: center; line-height: .95; }
  .stamp b { display: block; font-size: 100px; font-weight: 800; letter-spacing: .02em; }
  .stamp small { display: block; margin-top: 10px; font-size: 32px; font-weight: 800; letter-spacing: .2em; }

  .label { display: inline-flex; align-items: center; gap: 22px; padding: 24px 48px 24px 28px; border-radius: 26px; font-size: 64px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; transform: rotate(-3deg); }
  .label svg { width: 84px; height: 84px; }
  .l-yellow { background: #f3d36b; color: var(--ink); }
  .l-deep { background: var(--deep); color: #fff; }
  .l-deep svg { color: var(--orange-300); }
  .l-wine { background: var(--wine); color: #fff; }
  .l-wine svg { color: var(--orange-300); }
  .l-ink { background: var(--ink); color: #fff; }
  .l-ink svg { color: #f3d36b; }

  .bubble { position: relative; padding: 40px 56px; border-radius: 60px; background: #fff; font-size: 70px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .bubble::after { content: ""; position: absolute; left: 92px; bottom: -30px; width: 66px; height: 66px; background: inherit; border-radius: 0 0 16px 0; transform: rotate(45deg) skew(8deg, 8deg); }
  .bubble.or { background: var(--orange); }
  .bubble .spk-in { display: inline-block; width: 64px; height: 64px; margin-left: 14px; vertical-align: -6px; color: var(--wine); }
  .bubble .spk-in svg { width: 100%; height: 100%; }
  .bubble small { display: block; margin-bottom: 8px; font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: var(--wine); }

  .keyst { position: relative; width: 760px; height: 600px; }
  .keyst > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .keyst .kt { position: absolute; left: 330px; top: 150px; width: 360px; height: 400px; padding: 150px 30px 0; background: var(--wine); color: #fff; text-align: center; line-height: 1;
    clip-path: polygon(50% 0, 100% 30%, 100% 100%, 0 100%, 0 30%); border-radius: 0 0 36px 36px; transform: rotate(9deg); }
  .keyst .kt::before { content: ""; position: absolute; left: 50%; top: 62px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: #fff; box-shadow: inset 0 4px 6px rgba(0, 0, 0, .3); }
  .keyst .kt small { display: block; font-size: 26px; font-weight: 800; letter-spacing: .24em; color: var(--orange-300); }
  .keyst .kt b { display: block; margin-top: 14px; font-size: 76px; font-weight: 800; letter-spacing: -.04em; line-height: .95; }
  .keyst .kt i { display: block; margin-top: 16px; font-style: normal; font-size: 26px; font-weight: 700; color: rgba(255, 255, 255, .85); }

  .wa { display: inline-flex; align-items: center; gap: 24px; padding: 24px 48px 24px 24px; border-radius: 999px; background: #fff; }
  .wa .ic { display: grid; place-items: center; width: 116px; height: 116px; border-radius: 50%; background: var(--green); color: #fff; font-size: 70px; }
  .wa small { display: block; font-size: 28px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wa b { display: block; margin-top: 4px; font-size: 66px; font-weight: 800; letter-spacing: -.03em; }

  .linkbio { display: grid; justify-items: center; gap: 4px; }
  .linkbio .arrow { width: 260px; height: 220px; color: var(--orange); }
  .linkbio b { padding: 20px 44px; border-radius: 999px; background: var(--wine); color: #fff; font-size: 60px; font-weight: 800; letter-spacing: -.01em; }

  .deco { width: 520px; height: 420px; }
  .arc { position: relative; width: 760px; height: 400px; overflow: hidden; }
  .arc span { position: absolute; left: 50%; top: 0; border-radius: 50%; transform: translateX(-50%); border-style: solid; border-color: var(--c); border-width: 44px; }

  .round { display: grid; place-items: center; width: 460px; height: 460px; border-radius: 50%; background: var(--wine); color: #fff; text-align: center; transform: rotate(-6deg); position: relative; }
  .round::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 5px dashed rgba(255, 255, 255, .55); }
  .round svg { width: 110px; height: 110px; color: var(--orange-300); margin: 0 auto 6px; }
  .round small { display: block; font-size: 30px; font-weight: 800; letter-spacing: .24em; color: var(--orange-300); }
  .round b { display: block; font-size: 96px; line-height: .92; font-weight: 800; letter-spacing: -.04em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-joy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57b7e8"/><stop offset=".25" stop-color="#7dd6a4"/><stop offset=".5" stop-color="#f3d36b"/><stop offset=".75" stop-color="#f39a7a"/><stop offset="1" stop-color="#b77cdd"/>
    </linearGradient>
    <symbol id="pin" viewBox="0 0 32 32"><path fill="currentColor" d="M16 1.5A11.5 11.5 0 0 0 4.5 13c0 8 11.5 17.5 11.5 17.5S27.5 21 27.5 13A11.5 11.5 0 0 0 16 1.5z"/><path d="M20.6 9.3a6 6 0 1 0 0 7.4" fill="none" style="stroke: var(--pin-c, #fff)" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="pin-joy" viewBox="-2.5 -2.5 37 37"><path fill="url(#g-joy)" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke" d="M16 1.5A11.5 11.5 0 0 0 4.5 13c0 8 11.5 17.5 11.5 17.5S27.5 21 27.5 13A11.5 11.5 0 0 0 16 1.5z"/><path d="M20.6 9.3a6 6 0 1 0 0 7.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4H5a2 2 0 0 0 0 4h14a1 1 0 0 1 1 1v3M3 6v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12v4h-4a2 2 0 0 1 0-4h4z"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8M21 11v6h-6"/></symbol>
    <symbol id="bike" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-7h6l3 7M9.5 9L12 16h-6.5M14 6h2.5l-1 3"/></symbol>
    <symbol id="train" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 17l-2.5 4M15 17l2.5 4M8.5 14h.01M15.5 14h.01"/></symbol>
    <symbol id="hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></symbol>
    <symbol id="bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="question" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor"/><path d="M10 8.2l6 3.8-6 3.8z" fill="#3b2d93"/></symbol>

    const R = 50, r = 42, pts = [];
    for (let i = 0; i < points * 2; i++) {
      const a = (Math.PI * i) / points - Math.PI / 2;
      const rad = i % 2 ? r : R;
      pts.push(`${(50 + rad * Math.cos(a)).toFixed(2)},${(50 + rad * Math.sin(a)).toFixed(2)}`);
    }
    return `<svg viewBox="-6 -6 112 112"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"/></svg>`;
  };

    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * i) / n;
      const rad = i % 2 ? 46 : 50;
      pts.push(`${(50 + rad * Math.cos(a)).toFixed(2)},${(50 + rad * Math.sin(a)).toFixed(2)}`);
    }
    return `<svg viewBox="-6 -6 112 112"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><polygon points="${pts.join(' ')}" fill="${fill}" stroke="${fill}" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="50" r="38" fill="none" stroke="rgba(31,22,51,.35)" stroke-width="1" stroke-dasharray="2 2"/></svg>`;
